[package]
name = "aligner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "wav", "flac", "pcm"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "limit"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
whisper-rs = "0.16.0"
