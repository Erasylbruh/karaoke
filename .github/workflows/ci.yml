name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:storage
      - run: npm run build

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The test tooling is not a project dependency (see the header of tests/firestore.rules.test.mjs).
      - name: Run rules tests
        run: |
          mkdir -p "$RUNNER_TEMP/rules" && cd "$RUNNER_TEMP/rules"
          npm init -y > /dev/null
          npm i --no-audit --no-fund firebase-tools @firebase/rules-unit-testing@6 firebase@13
          cp "$GITHUB_WORKSPACE/firestore.rules" ./firestore.rules
          cp "$GITHUB_WORKSPACE/tests/firestore.rules.test.mjs" ./rules.test.mjs
          echo '{"firestore":{"rules":"firestore.rules"}}' > firebase.json
          RULES=./firestore.rules npx firebase emulators:exec --only firestore --project demo-karaoke "node --test rules.test.mjs"
